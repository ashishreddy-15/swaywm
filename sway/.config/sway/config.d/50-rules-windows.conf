# Window rules (adds to Fedora's 50-rules-*.conf: browsers, pavucontrol, polkit)

# Never lock or blank the screen while anything is fullscreen (mpv, games, ...)
for_window [shell=".*"] inhibit_idle fullscreen

# Dialogs and pop-ups float instead of tiling
for_window [window_role="pop-up"]      floating enable
for_window [window_role="bubble"]      floating enable
for_window [window_role="dialog"]      floating enable
for_window [window_type="dialog"]      floating enable
for_window [window_role="task_dialog"] floating enable

# File pickers and the tray applets' windows
for_window [app_id="xdg-desktop-portal-gtk"]  floating enable, resize set 900 600, move position center
for_window [app_id=".*blueman-manager.*"]     floating enable, move position center
for_window [app_id="nm-connection-editor"]    floating enable, move position center

# Drop-down terminal ($mod+Shift+Return): floats centred, lives in the scratchpad
for_window [app_id="dropdown"] floating enable, resize set width 60 ppt height 60 ppt, move position center, move scratchpad, scratchpad show
