# ── Idle / Lock configuration ────────────────────────────────
# Overrides /usr/share/sway/config.d/90-swayidle.conf
#
# The swayidle timeline (lock 5 min, screen off 10 min, suspend on battery
# 15 min) lives in scripts/idle.sh, which also handles "keep awake"
# (battery menu in the bar, or click AWAKE on the bar to turn it off).
#
# Manual lock: Mod+Shift+Escape  or  loginctl lock-session
# Swaylock appearance: ~/.config/swaylock/config

exec ~/.config/sway/scripts/idle.sh start
