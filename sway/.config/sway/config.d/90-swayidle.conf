# ── Idle / Lock configuration ────────────────────────────────
# Overrides /usr/share/sway/config.d/90-swayidle.conf
#
# Timeline:
#   5 min idle    → lock screen (swaylock)
#   10 min idle   → displays off (5 more min after lock)
#   Already locked + 30 s → displays off immediately
#
# Manual lock: Mod+Shift+l  or  loginctl lock-session
# Swaylock appearance: ~/.config/swaylock/config

exec swayidle -w \
    timeout 300 'swaylock -f' \
    timeout 600 'swaymsg "output * power off"' \
                resume 'swaymsg "output * power on"' \
    timeout 30  'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
                resume  'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"' \
    before-sleep 'swaylock -f' \
    lock         'swaylock -f' \
    unlock       'pkill -xu "$USER" -SIGUSR1 swaylock'
