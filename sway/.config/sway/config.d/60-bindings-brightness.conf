# ── Brightness bindings ───────────────────────────────────────
# Overrides /usr/share/sway/config.d/60-bindings-brightness.conf
#
# Context-aware brightness control based on focused output:
# - Laptop display (eDP-1): brightnessctl (clamped at floor >= 5%)
# - External monitor (HDMI-A-1): ddcutil
#
# Key                      Action
# ─────────────────────────────────────────────────────────────
# Mod+[                    Decrease brightness
# Mod+]                    Increase brightness
# XF86MonBrightnessDown    Decrease brightness
# XF86MonBrightnessUp      Increase brightness

bindsym {
    $mod+bracketleft       exec ~/.config/sway/scripts/brightness.sh down
    $mod+bracketright      exec ~/.config/sway/scripts/brightness.sh up
    XF86MonBrightnessDown  exec ~/.config/sway/scripts/brightness.sh down
    XF86MonBrightnessUp    exec ~/.config/sway/scripts/brightness.sh up
}
