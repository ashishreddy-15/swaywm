# Night light, screen recording, notifications, drop-down terminal, calc, emoji,
# appearance (GTK theme, dark/light, icons, cursor, font)
bindsym {
    $mod+n              exec ~/.config/sway/scripts/nightlight.sh
    Shift+Print         exec ~/.config/sway/scripts/record.sh

    $mod+grave          exec dunstctl history-pop
    $mod+Shift+grave    exec dunstctl close-all
    $mod+Shift+n        exec ~/.config/sway/scripts/dnd.sh

    $mod+Shift+Return   exec ~/.config/sway/scripts/dropdown.sh
    $mod+c              exec ~/.config/sway/scripts/calc.sh
    $mod+period         exec rofimoji --selector rofi
    $mod+Shift+a        exec ~/.config/sway/scripts/appearance.sh
}
