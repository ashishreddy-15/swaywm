# ── Screenshot bindings ───────────────────────────────────────
# Overrides /usr/share/sway/config.d/60-bindings-screenshot.conf
#
# Uses `grimshot savecopy` to both save the file to ~/Pictures (or
# $XDG_SCREENSHOTS_DIR) AND copy the image directly to the clipboard.
#
# Key         Action
# ─────────────────────────────────────────────────────────────
# Print       Full output (current monitor) → save & copy
# Alt+Print   Focused window                → save & copy
# Ctrl+Print  Select region (slurp)         → save & copy

bindsym {
    Print       exec grimshot --notify savecopy output
    Alt+Print   exec grimshot --notify savecopy active
    Ctrl+Print  exec grimshot --notify savecopy area
}
