<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <dir>~/.local/share/fonts</dir>

    <!-- Subpixel (RGB) smoothing: sharper text on low-density screens like
         the 27" 1440p Samsung (~109 PPI). -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="rgba"      mode="assign"><const>rgb</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    </match>

    <!-- The installed Maple Mono NF is the "unhinted" build, so let
         FreeType's autohinter snap its glyphs to the pixel grid. -->
    <match target="font">
        <test name="family"><string>Maple Mono NF</string></test>
        <edit name="autohint"  mode="assign"><bool>true</bool></edit>
        <edit name="hinting"   mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    </match>
</fontconfig>
