# Sway config for the SDDM greeter (runs as the sddm user, before login).
# Installed to /etc/sddm/sway-greeter.conf by setup/sddm.sh and used via
# CompositorCommand in 10-swaywm.conf. Replaces /etc/sway/sddm-greeter.config.
#
# Mirrors the parts of ~/.config/sway/config that matter at the login screen.
# Keep the output and input blocks in sync with it.

xwayland disable

# ── Outputs (same layout as the desktop) ────────────────────
output eDP-1 resolution 1920x1200 position 0,240 subpixel rgb
output "Samsung Electric Company LS27F61x H4CL500159" resolution 2560x1440@100Hz position 1920,0 subpixel rgb
output * bg #0f110d solid_color

# Clamshell: with the lid closed and another screen connected, turn the
# laptop panel off so the login form lands on the external screen.
bindswitch --reload --locked lid:on exec sh -c '[ "$(swaymsg -t get_outputs | grep -c "\"name\":")" -gt 1 ] && swaymsg output eDP-1 disable'
bindswitch --reload --locked lid:off output eDP-1 enable

# ── Look ────────────────────────────────────────────────────
default_border none
default_floating_border none
seat seat0 xcursor_theme Adwaita 24

# The greeter covers each screen
for_window [app_id="sddm-greeter"] fullscreen enable

# ── Input (same as the desktop) ─────────────────────────────
# locale1-xkb-config is left out on purpose: it would reset xkb_options.
input "type:keyboard" {
    repeat_delay 400
    repeat_rate 30
    xkb_options caps:escape
}

input "type:touchpad" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    scroll_method two_finger
}

# ── Power ───────────────────────────────────────────────────
# Screens off after 5 minutes at the login screen
exec command -v swayidle >/dev/null && swayidle -w \
        timeout 300 'swaymsg "output * power off"' \
             resume 'swaymsg "output * power on"'

# Fallback if the greeter itself fails to start
bindsym Mod4+Shift+e exec swaynag -t warning -m 'Power' \
        -b 'Poweroff' 'systemctl poweroff' \
        -b 'Reboot' 'systemctl reboot'
