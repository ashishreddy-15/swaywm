# SDDM drop-in, installed to /etc/sddm.conf.d/ by setup/sddm.sh.
# Overrides /usr/lib/sddm/sddm.conf.d/wayland-sway.conf without touching
# package-owned files. Remove this file to get the stock greeter back.

[Theme]
Current=mono
CursorTheme=Adwaita
CursorSize=24

[Wayland]
CompositorCommand=/usr/bin/sway --config /etc/sddm/sway-greeter.conf
