# mpv — tuned for Intel Core Ultra 5 125U (Meteor Lake, Arc Xe-LPG iGPU)
# on Wayland, with a 1920x1200 laptop panel and a 2560x1440@100Hz monitor.
# Palette: see colors.md in the dotfiles repo.

# ── Video output ────────────────────────────────────────────
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
# Hardware decoding through VAAPI (intel-media-driver). Verified on this
# machine: H.264, HEVC 8/10-bit, VP9 and AV1 all decode on the GPU, which
# keeps the CPU idle and saves battery.
hwdec=vaapi
hwdec-codecs=all

# ── Quality ─────────────────────────────────────────────────
# high-quality profile for downscaling, debanding and colour handling, but with
# spline36 instead of its EWA upscaler: measured here, EWA made ~10% of frames
# render late at 1440p fullscreen, spline36 stays on time and is still sharp.
# For long battery sessions see [battery] below.
profile=high-quality
scale=spline36
cscale=spline36
deband=yes
dither-depth=auto

# Smooth motion: 24/25/30 fps video on the 100 Hz monitor would judder
# (100 is not a multiple of 24). Resample to the display and blend frames.
video-sync=display-resample
interpolation=yes
tscale=oversample

# ── Window & behaviour ──────────────────────────────────────
background-color='#0f110d'
keep-open=yes
save-position-on-quit=yes
autofit-larger=80%x80%
cursor-autohide=1000
force-window=immediate

# ── OSD (on-screen text) ────────────────────────────────────
osd-font='Maple Mono NF'
osd-font-size=26
osd-color='#e6e8e1'
osd-border-color='#0f110d'
osd-border-size=1.5
osd-shadow-offset=0
osd-duration=1500
osd-bar-align-y=0.85
osd-bar-h=1.5
osd-bar-w=50
osd-playing-msg='${media-title}'
osd-playing-msg-duration=2000

# ── Subtitles ───────────────────────────────────────────────
sub-auto=fuzzy
slang=en,eng
sub-font='Inter'
sub-font-size=42
sub-bold=yes
sub-color='#e6e8e1'
sub-border-color='#0f110d'
sub-border-size=2.5
sub-shadow-offset=0
sub-margin-y=40
sub-ass-override=no

# ── Audio ───────────────────────────────────────────────────
alang=en,eng
audio-file-auto=fuzzy
volume=100
volume-max=150

# ── Screenshots ─────────────────────────────────────────────
screenshot-dir=~/Pictures/mpv
screenshot-format=png
screenshot-png-compression=7
screenshot-template='%F-%wH.%wM.%wS'

# ── Streaming (yt-dlp) and cache ────────────────────────────
# Cap at 1440p (your largest screen); AV1/VP9 are fine, the GPU decodes both.
ytdl-format='bestvideo[height<=?1440]+bestaudio/best'
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB

# ── Profiles ────────────────────────────────────────────────
# Lighter rendering for long sessions on battery: mpv --profile=battery
# (or press Ctrl+f while playing, see input.conf)
[battery]
profile-desc='lighter rendering for battery'
profile=fast
interpolation=no
deband=no
